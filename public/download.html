<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ดาวน์โหลดวิดีโอ CockpitSure</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
    background: #1A1A1A; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  h1 { color: #FFE000; font-size: 18px; margin: 0 0 8px; }
  p { color: #9ca3af; font-size: 14px; margin: 4px 0 20px; }
  video { width: 100%; max-width: 420px; border-radius: 12px; margin-bottom: 20px; background: #000; }
  button {
    width: 100%; max-width: 420px; padding: 16px; font-size: 16px; font-weight: bold;
    background: #FFE000; color: #1A1A1A; border: none; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  button:disabled { opacity: 0.6; }
  #status { margin-top: 14px; font-size: 13px; color: #9ca3af; min-height: 18px; }
  #fallback { margin-top: 20px; font-size: 12px; color: #6b7280; max-width: 420px; }
  #fallback a { color: #FFE000; }
</style>
</head>
<body>
  <h1>🎥 วีดีโอผลการตรวจสภาพ CockpitSure</h1>
  <p id="carInfo">กำลังโหลดวิดีโอ...</p>
  <video id="preview" controls playsinline muted></video>
  <button id="dlBtn">⬇️ ดาวน์โหลดเก็บวิดีโอ</button>
  <div id="status"></div>
  <div id="fallback"></div>

<script>
  const params = new URLSearchParams(location.search);
  const videoUrl = params.get("url");
  const fileName = params.get("name") || "CockpitSure.mp4";
  const plate = params.get("plate") || "";
  const branch = params.get("branch") || "";

  const video   = document.getElementById("preview");
  const btn     = document.getElementById("dlBtn");
  const status  = document.getElementById("status");
  const info    = document.getElementById("carInfo");
  const fallback= document.getElementById("fallback");

  if (!videoUrl) {
    info.textContent = "ไม่พบลิงก์วิดีโอ";
    btn.disabled = true;
  } else {
    info.textContent = [plate && `🚗 ${plate}`, branch && `📍 ${branch}`].filter(Boolean).join("   ");
    video.src = videoUrl;
    fallback.innerHTML = `ถ้าเจอ popup "เว็บไซต์นี้พยายามจะเปิดแอปพลิเคชันภายนอก" ให้กด "อนุญาต"<br><br>
      หากปุ่มกดไม่ได้เลย ให้แตะเมนู "•••" มุมขวาบน แล้วเลือก "เปิดใน Safari/Chrome" จากนั้นกดปุ่มดาวน์โหลดอีกครั้ง<br><br>
      หรือกดค้างที่วิดีโอด้านบนแล้วเลือก "บันทึกวิดีโอ"<br><br>
      <a href="${videoUrl}" target="_blank">เปิดวิดีโอโดยตรง</a>`;
  }

  btn.addEventListener("click", async () => {
    if (!videoUrl) return;
    btn.disabled = true;
    status.textContent = "⏳ กำลังดาวน์โหลด...";
    try {
      const res = await fetch(videoUrl, { mode: "cors" });
      if (!res.ok) throw new Error("โหลดไฟล์ไม่สำเร็จ");
      const blob = await res.blob();
      const file = new File([blob], fileName, { type: blob.type || "video/mp4" });

      // วิธีที่ 1: Web Share API — เรียก native share sheet ของ iOS/Android ตรงๆ
      // ไม่ผ่านการ "นำทาง" ไป blob: URL เลย จึงไม่โดน LINE webview
      // ดักจับเป็น "เปิดแอปภายนอก" แบบที่เจอตอนใช้ anchor+blob
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fileName });
        status.textContent = "✅ เลือก \"บันทึกวิดีโอ\" ในเมนูแชร์เพื่อเก็บลงเครื่อง";
        btn.disabled = false;
        return;
      }

      // วิธีสำรอง: anchor + blob (ใช้ได้ดีใน Chrome/Safari ปกติ แต่ LINE webview อาจมี popup กวน)
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
      status.textContent = "✅ บันทึกวิดีโอแล้ว (เช็คโฟลเดอร์ดาวน์โหลด/คลังรูปของเครื่อง)";
    } catch (e) {
      status.textContent = "⚠️ ดาวน์โหลดอัตโนมัติไม่สำเร็จ — ลองวิธีด้านล่างแทน";
      console.error(e);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
